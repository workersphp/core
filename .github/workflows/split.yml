# Pushes packages/laravel-bridge to its read-only Packagist mirror repo.
# Requires the SPLIT_TOKEN secret: a fine-grained PAT with contents:write on
# the mirror repository.
name: Split laravel-bridge

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['packages/laravel-bridge/**']

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: danharrin/monorepo-split-github-action@v2.3.0
        with:
          package_directory: packages/laravel-bridge
          repository_organization: workersphp
          repository_name: laravel-bridge
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
        env:
          GITHUB_TOKEN: ${{ secrets.SPLIT_TOKEN }}
