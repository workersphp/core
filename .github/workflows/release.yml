# Creates the GitHub Release for a version tag. npm publishes stay manual at
# 0.x (see RELEASING.md); wasm artifacts are uploaded manually after a local
# build so the maintainer's checksums are the ones that ship.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        run: gh release create '${{ github.ref_name }}' --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
